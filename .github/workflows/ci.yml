name: Homebrew isolation diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose Linux trust under network denial
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Expose the disposable runner's Homebrew
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Update the disposable runner's Homebrew
        run: brew update
      - name: Compare explicit command trust in isolated contexts
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, pwd, shutil, subprocess, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "trust-diagnosis"
          root.mkdir(mode=0o700)
          os.umask(0o077)
          env = {k: v for k, v in os.environ.items() if k not in {"GH_TOKEN", "GITHUB_TOKEN", "HOMEBREW_GITHUB_API_TOKEN"}}
          for key, name in (("HOMEBREW_USER_CONFIG_HOME", "brew-config"), ("XDG_CONFIG_HOME", "xdg-config"),
                            ("HOMEBREW_CACHE", "brew-cache"), ("HOMEBREW_LOGS", "brew-logs")):
              env[key] = str(root / name)
              pathlib.Path(env[key]).mkdir(mode=0o700)
          env.update(HOMEBREW_NO_AUTO_UPDATE="1", HOMEBREW_NO_INSTALL_FROM_API="1", HOMEBREW_NO_ANALYTICS="1")
          records = []
          def run(label, argv, run_env=env, required=True):
              result = subprocess.run(argv, env=run_env, text=True, capture_output=True, timeout=180)
              (root / (label + ".stdout")).write_text(result.stdout)
              (root / (label + ".stderr")).write_text(result.stderr)
              records.append({"label": label, "argv": argv, "exit_code": result.returncode})
              (root / "commands.json").write_text(json.dumps(records, indent=2) + "\n")
              if required and result.returncode:
                  raise RuntimeError("Diagnostic command failed: " + label)
              return result
          brew = shutil.which("brew", path=env["PATH"])
          assert brew is not None
          repo = pathlib.Path(run("brew-repository", [brew, "--repository"]).stdout.strip())
          run("brew-version", [brew, "--version"])
          run("brew-source-head", ["git", "-C", str(repo), "rev-parse", "HEAD"])
          destination = repo / "Library/Taps/0merufuk/homebrew-skuggsja"
          assert not destination.exists(), "Fresh diagnostic runner unexpectedly already has the destination tap"
          destination.parent.mkdir(parents=True, exist_ok=True)
          run("clone-canonical-tap", ["git", "clone", "--no-hardlinks", "https://github.com/0merUfuk/homebrew-skuggsja", str(destination)])
          candidate = "546cf69e5e1c05819ac09aae4d28578286524281"
          run("fetch-exact-candidate", ["git", "-C", str(destination), "fetch", "--no-tags", "origin", candidate])
          run("checkout-exact-candidate", ["git", "-C", str(destination), "checkout", "--detach", candidate])
          assert run("candidate-head", ["git", "-C", str(destination), "rev-parse", "HEAD"]).stdout.strip() == candidate
          command = "0merUfuk/skuggsja/skuggsja-migrate"
          run("trust-only-command", [brew, "trust", "--command", command])
          keys = ["USER", "LOGNAME", "HOME", "XDG_CONFIG_HOME", "HOMEBREW_XDG_CONFIG_HOME", "HOMEBREW_USER_CONFIG_HOME",
                  "HOMEBREW_FORCE_BREW_WRAPPER", "HOMEBREW_ORIGINAL_BREW_FILE", "HOMEBREW_BREW_FILE",
                  "HOMEBREW_REPOSITORY", "HOMEBREW_PREFIX", "HOMEBREW_SUDO_USER", "SUDO_USER", "SUDO_UID", "SUDO_GID",
                  "CI", "GITHUB_ACTIONS", "HOMEBREW_CI", "HOMEBREW_REQUIRE_TAP_TRUST", "HOMEBREW_NO_REQUIRE_TAP_TRUST",
                  "HOMEBREW_NO_AUTO_UPDATE", "HOMEBREW_NO_INSTALL_FROM_API", "HOMEBREW_NO_ANALYTICS"]
          probe = root / "context.py"
          probe.write_text('''import hashlib,json,os,pathlib,pwd,subprocess,sys
          keys=json.loads(sys.argv[1]); brew=sys.argv[2]
          record={"uid":os.getuid(),"euid":os.geteuid(),"gid":os.getgid(),"groups":os.getgroups(),"account":pwd.getpwuid(os.getuid()).pw_name,"env":{k:os.environ.get(k) for k in keys},"brew":brew,"brew_realpath":str(pathlib.Path(brew).resolve())}
          xdg=os.environ.get("XDG_CONFIG_HOME") or os.environ.get("HOMEBREW_XDG_CONFIG_HOME")
          config=pathlib.Path(xdg)/"homebrew" if xdg else pathlib.Path(os.environ["HOME"])/".homebrew"
          trust=config/"trust.json"
          record["derived_config_directory"]=str(config)
          record["trust_path"]=str(trust)
          record["trust_exists"]=trust.exists()
          if trust.exists():
              data=trust.read_bytes(); st=trust.stat()
              record["trust"]={"sha256":hashlib.sha256(data).hexdigest(),"mode":oct(st.st_mode&0o777),"uid":st.st_uid,"gid":st.st_gid,"bytes":data.decode()}
          startup = len(sys.argv)>3 and sys.argv[3]=="startup"
          ruby = 'require "trust"; require "json"; puts JSON.generate({trust_file: Homebrew::Trust.trust_file.to_s, user_config_home: ENV["HOMEBREW_USER_CONFIG_HOME"], user: ENV["USER"], ci: Homebrew::EnvConfig.respond_to?(:ci?) ? Homebrew::EnvConfig.ci? : nil})'
          commands = (("actual_homebrew_startup",["ruby","-e",ruby]),) if startup else (("prefix",["--prefix"]),("repository",["--repository"]),("command_trust",["trust","--command","--json=v1"]),("external_check",["skuggsja-migrate","--check"]))
          for name,args in commands:
              result=subprocess.run([brew,*args],capture_output=True,text=True,timeout=60)
              record[name]={"exit_code":result.returncode,"stdout":result.stdout,"stderr":result.stderr}
          print(json.dumps(record,indent=2))
          ''')
          kept = ["HOME", "PATH", "XDG_CONFIG_HOME", "HOMEBREW_USER_CONFIG_HOME", "HOMEBREW_CACHE", "HOMEBREW_LOGS",
                  "HOMEBREW_NO_AUTO_UPDATE", "HOMEBREW_NO_ANALYTICS", "HOMEBREW_NO_INSTALL_CLEANUP", "HOMEBREW_NO_INSTALL_FROM_API"]
          sudo, unshare, setpriv = [shutil.which(n) for n in ("sudo", "unshare", "setpriv")]
          assert all((sudo, unshare, setpriv))
          original = [sudo, "-n", "--preserve-env=" + ",".join(kept), unshare, "--net", "--", setpriv,
                      "--reuid", str(os.getuid()), "--regid", str(os.getgid()), "--init-groups"]
          control = "import errno,socket; s=socket.socket(); s.settimeout(2); n=s.connect_ex(('198.51.100.1',443)); print(n); assert n in (errno.EPERM,errno.EACCES,errno.ENETUNREACH)"
          run("network-denial-control", [*original, sys.executable, "-c", control])
          base = run("baseline-context", [sys.executable, str(probe), json.dumps(keys), brew])
          # The first namespace uses exactly the failed lifecycle wrapper.
          observed = run("original-denied-context", [*original, sys.executable, str(probe), json.dumps(keys), brew])
          # Variants change only inherited identity/config values, keeping the
          # same UID drop, network namespace and command-scoped trust decision.
          identities = ["USER", "LOGNAME", "HOMEBREW_XDG_CONFIG_HOME"]
          preserved = original.copy()
          preserved[2] = "--preserve-env=" + ",".join(kept + identities)
          run("identity-preserved-control", [*preserved, sys.executable, "-c", control])
          run("identity-preserved-context", [*preserved, sys.executable, str(probe), json.dumps(keys), brew])
          restore = ["USER=" + pwd.getpwuid(os.getuid()).pw_name, "LOGNAME=" + pwd.getpwuid(os.getuid()).pw_name]
          restore += [k + "=" + env[k] for k in kept if k in env]
          restored = [*original, "/usr/bin/env", *restore]
          run("explicit-restored-control", [*restored, sys.executable, "-c", control])
          run("explicit-restored-context", [*restored, sys.executable, str(probe), json.dumps(keys), brew])
          # Run the developer-command startup probe only after every ordinary
          # context/external-command observation. Homebrew may enable developer
          # mode in this disposable repository; it cannot affect those originals.
          for label, prefix in (("baseline", []), ("original-denied", original), ("identity-preserved", preserved), ("explicit-restored", restored)):
              run(label + "-startup", [*prefix, sys.executable, str(probe), json.dumps(keys), brew, "startup"])
          result = {"scope": "Diagnosis only; no Skuggsja package installed, no migration acceptance or trust bypass. Final brew ruby probes may enable developer mode in the disposable Homebrew repository, after original observations.", "candidate": candidate,
                    "original_context": json.loads(observed.stdout), "baseline_context": json.loads(base.stdout)}
          (root / "diagnosis.json").write_text(json.dumps(result, indent=2) + "\n")
          print("Trust diagnostics captured; compare context files before selecting any correction.")
          PY
      - name: Retain bounded trust diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-trust-diagnosis-${{ github.sha }}
          path: |
            ${{ runner.temp }}/trust-diagnosis/*.json
            ${{ runner.temp }}/trust-diagnosis/*.stdout
            ${{ runner.temp }}/trust-diagnosis/*.stderr
          if-no-files-found: error
          retention-days: 14
